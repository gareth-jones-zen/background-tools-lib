name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build -c Release
      - name: Test
        run: dotnet test -c Release --no-build
      - name: Native AOT check
        run: dotnet publish tests/LockHelper -c Release -r win-x64 -o out/aot
      - name: Run the AOT build
        run: out/aot/LockHelper.exe async ci-aot-check
      - name: Publish (Native AOT)
        run: |
          dotnet publish src/ClaudeHeadless.Console -c Release -r win-x64 -o out
          dotnet publish src/ClaudeHeadless.Background -c Release -r win-x64 -o out
          Get-ChildItem out/*.exe | Format-Table Name, Length
      - name: Native AOT check (EdgeDevTools and PeopleFirstClient)
        run: dotnet publish tests/EdgeHelper -c Release -r win-x64 -o out/aot-edge
      - name: Run the AOT build against Edge (a throwaway profile, no network)
        run: out/aot-edge/EdgeHelper.exe smoke "$env:RUNNER_TEMP\edge-smoke-profile"
